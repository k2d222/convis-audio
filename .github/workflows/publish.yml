name: Publish

# Publishes `@convis/audio-native` to npm, and `@convis/audio-<target>` for every target (win, mac, linux)
#
# Triggered by pushing a `vX.Y.Z` tag. The manual dispatch only runs the build jobs.

on:
  workflow_dispatch:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+

permissions: {}

env:
  DEBUG: napi:*
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  RUST_TOOLCHAIN: "1.97.1"
  NODE_VERSION: "24"

# this creates a concurrency group, and will cancel in-progress jobs when pushing to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            deps: sudo apt install -y libasound2-dev
            target: x86_64-unknown-linux-gnu
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: aarch64-pc-windows-msvc
          # setting up alsa-sys is not working straight away with cross compilation.
          # - host: ubuntu-latest
          #   deps: sudo apt install -y libasound2-dev
          #   target: aarch64-unknown-linux-gnu
          #   flags: -x
    name: build target ${{ matrix.cfg.target }}
    runs-on: ${{ matrix.cfg.host }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}

      - name: Setup zig (for cross-compilation)
        if: matrix.cfg.target == 'aarch64-unknown-linux-gnu'
        uses: mlugg/setup-zig@v2 # need zig for cargo-zigbuild for cross-compilation

      - name: Install OS dependencies
        if: ${{ matrix.cfg.deps }}
        run: ${{ matrix.cfg.deps }}
        shell: bash

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.cfg.target }}

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release
        run: pnpm napi build --release --target ${{ matrix.cfg.target }} ${{ matrix.cfg.flags }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: 'audio.node'
          name: audio.${{ matrix.cfg.target }}.node
          if-no-files-found: error

  publish-npm:
    name: Publish (npm)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Move artifacts
        run: |
          for dir in audio.*.node/; do
            triplet="${dir%.node/}"       # audio.<triplet>.node/ -> audio.<triplet>
            triplet="${triplet#audio.}"   # audio.<triplet> -> <triplet>

            src="$dir/audio.node"
            dst="platforms/$triplet/audio.$triplet.node"

            mv "$src" "$dst"
            rmdir "$dir"
          done

      - name: Publish to npm
        env:
          DIST_TAG: ${{ contains(github.ref_name, '-rc') && 'next' || 'latest' }}
        run: |
          pnpm stage publish -r --tag "$DIST_TAG"

