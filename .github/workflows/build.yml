name: build
env:
  DEBUG: napi:*
  APP_NAME: '@convis/audio'
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
permissions: {} # doesn't need any permission.
on: workflow-dispatch # triggered manually in GitHub

# this creates a concurrency group, and will cancel in-progress jobs when pushing to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        - host: macos-latest
          target: x86_64-apple-darwin
        - host: windows-latest
          target: x86_64-pc-windows-msvc
        - host: ubuntu-latest
          target: x86_64-unknown-linux-gnu
        - host: macos-latest
          target: aarch64-apple-darwin
          build: pnpm build --target aarch64-apple-darwin
        - host: windows-latest
          target: x86_64-pc-windows-msvc
        - host: ubuntu-latest
          target: aarch64-unknown-linux-gnu
    name: build target ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v6
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # - name: Cache cargo
      #   uses: actions/cache@v5
      #   with:
      #     path: |
      #       ~/.cargo/registry/index/
      #       ~/.cargo/registry/cache/
      #       ~/.cargo/git/db/
      #       ~/.napi-rs
      #       .cargo-cache
      #       target/
      #     key: ${{ matrix.target }}-cargo-${{ matrix.host }}
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm run napi build --platform --release --target ${{ matrix.build }}
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: '*.node'
          if-no-files-found: error
