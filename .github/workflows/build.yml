name: build
env:
  DEBUG: napi:*
  APP_NAME: '@convis/audio'
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
on: workflow_dispatch # triggered manually in GitHub

# this creates a concurrency group, and will cancel in-progress jobs when pushing to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            deps: sudo apt install -y libasound2-dev
            target: x86_64-unknown-linux-gnu
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm build --target aarch64-apple-darwin
          - host: windows-latest
            target: aarch64-pc-windows-msvc
          # GitHub doesn't have a runner for aarch64, but we don't really need it.
          # We could easily cross-compile from x64 if needed.
          # - host: ubuntu-latest
          #   deps: sudo apt install -y libasound2-dev
          #   target: aarch64-unknown-linux-gnu
    name: build target ${{ matrix.cfg.target }}
    runs-on: ${{ matrix.cfg.host }}
    steps:
      - uses: actions/checkout@v6
      - name: setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install OS dependencies
        if: ${{ matrix.cfg.deps }}
        run: ${{ matrix.cfg.deps }}
        shell: bash
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.cfg.target }}
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm napi build --platform --release --target ${{ matrix.cfg.target }}
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: '*.node'
          name: audio-${{ matrix.cfg.target }}.node
          if-no-files-found: error
